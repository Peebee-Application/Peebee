name: Apply reviewed database migration

# Explicit operator action only. Application deployments never apply migrations.
on:
  workflow_dispatch:
    inputs:
      file:
        description: Reviewed SQL filename from apps/api/src/db/migrations on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peebee-live-database-migration
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5b3ae942adb5457f1fa4d7f5effbf3ff
      MIGRATION_FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployment source and reviewed filename
        run: |
          node scripts/preflight-deploy.mjs
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const file = process.env.MIGRATION_FILE;
          if (!/^\d{4}_[a-z0-9_]+\.sql$/.test(file ?? '')) throw new Error('Choose one SQL migration filename.');
          execFileSync('git', ['ls-files', '--error-unmatch', `apps/api/src/db/migrations/${file}`], { stdio: 'inherit' });
          JS
      - name: Apply the selected migration to Peebee D1
        working-directory: apps/api
        run: pnpm exec wrangler d1 execute peebee-api --remote --file "src/db/migrations/$MIGRATION_FILE"
