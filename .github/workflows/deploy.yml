name: Deploy to Cloudflare

# Every commit merged to main deploys the Workers whose code changed.
# Requires repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Deploys go through each app's normal `pnpm run deploy`, so
# scripts/preflight-deploy.mjs still runs and must pass (clean main == origin/main).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated apps to deploy (api admin customer merchant restaurant rider web), or "all"'
        default: all

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        env:
          MANUAL: ${{ github.event.inputs.apps }}
        run: |
          ALL="api admin customer merchant restaurant rider web"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "$MANUAL" = "all" ] || [ -z "$MANUAL" ] && APPS="$ALL" || APPS="$MANUAL"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
            # Shared code, lockfile, workspace or deploy tooling changes affect every app.
            if echo "$CHANGED" | grep -qE '^(packages/|pnpm-lock.yaml|package.json|pnpm-workspace.yaml|\.npmrc|scripts/|\.github/workflows/deploy.yml)'; then
              APPS="$ALL"
            else
              APPS=""
              for a in $ALL; do
                echo "$CHANGED" | grep -q "^apps/$a/" && APPS="$APPS $a"
              done
            fi
          fi
          JSON=$(printf '%s\n' $APPS | grep -v '^$' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "Deploying: $JSON"
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Checked out as a local branch named `main` at the pushed commit, which is
      # what scripts/preflight-deploy.mjs requires.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API before deploying it
        if: ${{ matrix.app == 'api' }}
        run: pnpm --filter api lint
      - name: Deploy ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm run deploy
