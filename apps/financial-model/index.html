<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build a consolidated forecast for Peebee's business channels.">
  <title>Peebee Financial Model</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="line-items.js"></script>
  <script defer src="assumptions.js"></script>
  <script defer src="model.js"></script>
  <script defer src="peebee-defaults.js"></script>
  <script defer src="channels.js"></script>
  <script defer src="analysis.js"></script>
  <script defer src="forecast-charts.js"></script>
  <script defer src="live.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Peebee Financial Model</div>
      <div class="toolbar">
        <button class="button secondary small" id="live-data" type="button" hidden>Live Admin data</button>
        <button class="button secondary small" id="open-settings" type="button">Settings</button>
        <button class="button secondary small" id="reset-model" type="button">Reset to Peebee defaults</button>
      </div>
    </div>
  </header>
  <main id="app" class="shell"></main>
  <dialog id="live-dialog" class="panel" aria-labelledby="live-title"></dialog>
  <dialog id="settings-dialog" class="panel model-dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <label class="autosave-option">
      <span class="autosave-copy"><strong>Autosave</strong><span id="autosave-help">Save valid answers when you leave a question.</span></span>
      <span class="autosave-switch">
        <input type="checkbox" role="switch" data-autosave aria-label="Autosave" aria-describedby="autosave-help">
        <span class="autosave-track" aria-hidden="true"></span>
      </span>
    </label>
    <form method="dialog" class="dialog-actions"><button class="button gold">Done</button></form>
  </dialog>
  <dialog id="unsaved-dialog" class="panel model-dialog" aria-labelledby="unsaved-title" aria-describedby="unsaved-help">
    <h2 id="unsaved-title">Save this answer?</h2>
    <p id="unsaved-help" class="muted">You have unsaved changes to <strong id="unsaved-question"></strong>.</p>
    <label class="autosave-option">
      <span class="autosave-copy"><strong>Autosave</strong><span id="unsaved-autosave-help">Save valid answers when you leave a question.</span></span>
      <span class="autosave-switch">
        <input type="checkbox" role="switch" data-autosave aria-label="Autosave" aria-describedby="unsaved-autosave-help">
        <span class="autosave-track" aria-hidden="true"></span>
      </span>
    </label>
    <form method="dialog" class="dialog-actions unsaved-actions">
      <button class="text-button" value="discard">Discard changes</button>
      <button class="button secondary" value="stay" autofocus>Stay here</button>
      <button class="button gold" value="save">Save and continue</button>
    </form>
  </dialog>
  <footer class="footer">Forecasts use the assumptions you enter. Drafts are stored on this device when browser storage is available.</footer>
  <noscript>Enable JavaScript to build and view your financial model.</noscript>
</body>
</html>
