<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build a consolidated forecast for Peebee's business channels.">
  <title>Peebee Financial Model</title>
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script defer src="line-items.js"></script>
  <script defer src="assumptions.js"></script>
  <script defer src="model.js"></script>
  <script defer src="peebee-defaults.js"></script>
  <script defer src="channels.js"></script>
  <script defer src="analysis.js"></script>
  <script defer src="forecast-charts.js"></script>
  <script defer src="live.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <button class="button secondary settings-icon" id="open-settings" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12.5 2h-1a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.5.87a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.5a2 2 0 0 1-1 1.73l-.15.09a2 2 0 0 0-.73 2.73l.5.87a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.5-.87a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.73v-.5a2 2 0 0 1 1-1.73l.15-.09a2 2 0 0 0 .73-2.73l-.5-.87a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        </svg>
      </button>
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Peebee Financial Model</div>
      <nav id="primary-nav" class="primary-nav" aria-label="Forecast sections"></nav>
    </div>
    <nav id="secondary-nav" class="secondary-nav" aria-label="Forecast views"></nav>
  </header>
  <main id="app" class="shell"></main>
  <dialog id="live-dialog" class="panel" aria-labelledby="live-title"></dialog>
  <dialog id="settings-dialog" class="panel model-dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <div class="appearance-option">
      <label for="appearance-mode">Appearance</label>
      <select id="appearance-mode" aria-describedby="appearance-help">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="system" selected>System</option>
        <option value="auto">Auto</option>
      </select>
      <span id="appearance-help" class="muted">System follows your device. Auto uses light from 7 a.m. to 7 p.m. in your local time.</span>
    </div>
    <label class="autosave-option">
      <span class="autosave-copy"><strong>Autosave</strong><span id="autosave-help">Save valid answers when you leave a question.</span></span>
      <span class="autosave-switch">
        <input type="checkbox" role="switch" data-autosave aria-label="Autosave" aria-describedby="autosave-help">
        <span class="autosave-track" aria-hidden="true"></span>
      </span>
    </label>
    <section class="settings-actions" aria-labelledby="settings-data-title">
      <h3 id="settings-data-title">Data and reset</h3>
      <button class="button secondary" id="live-data" type="button" aria-haspopup="dialog" hidden>Live Admin data</button>
      <button class="button secondary" id="reset-model" type="button" aria-haspopup="dialog">Reset to Peebee defaults</button>
    </section>
    <form method="dialog" class="dialog-actions"><button class="button gold">Done</button></form>
  </dialog>
  <dialog id="confirm-action" class="panel model-dialog" role="alertdialog" aria-labelledby="confirm-action-title" aria-describedby="confirm-action-detail">
    <h2 id="confirm-action-title"></h2>
    <p id="confirm-action-detail" class="notice"></p>
    <form method="dialog" class="dialog-actions">
      <button class="button secondary" value="cancel" autofocus>Cancel</button>
      <button class="button gold" id="confirm-action-submit" value="confirm"></button>
    </form>
  </dialog>
  <dialog id="unsaved-dialog" class="panel model-dialog" aria-labelledby="unsaved-title" aria-describedby="unsaved-help">
    <h2 id="unsaved-title">Save this answer?</h2>
    <p id="unsaved-help" class="muted">You have unsaved changes to <strong id="unsaved-question"></strong>.</p>
    <label class="autosave-option">
      <span class="autosave-copy"><strong>Autosave</strong><span id="unsaved-autosave-help">Save valid answers when you leave a question.</span></span>
      <span class="autosave-switch">
        <input type="checkbox" role="switch" data-autosave aria-label="Autosave" aria-describedby="unsaved-autosave-help">
        <span class="autosave-track" aria-hidden="true"></span>
      </span>
    </label>
    <form method="dialog" class="dialog-actions unsaved-actions">
      <button class="text-button" value="discard">Discard changes</button>
      <button class="button secondary" value="stay" autofocus>Stay here</button>
      <button class="button gold" value="save">Save and continue</button>
    </form>
  </dialog>
  <footer class="footer">Forecasts use the assumptions you enter. Drafts are stored on this device when browser storage is available.</footer>
  <noscript>Enable JavaScript to build and view your financial model.</noscript>
</body>
</html>
